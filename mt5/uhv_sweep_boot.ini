; ============================================================================
;  uhv_sweep_boot.ini — MT5 startup config for UhvSweepExhaustion
; ============================================================================
;
;  Usage:
;    "C:\Program Files\Blueberry Markets MetaTrader 5\terminal64.exe" ^
;        /config:"C:\Users\zeesh\Documents\GitHub\turtle\mt5\uhv_sweep_boot.ini"
;
;  What this gives you:
;    - MT5 boots straight to the Blueberry server with the demo login filled in
;    - Live trading + DLL imports are pre-enabled (no permission popup)
;    - News/proxy disabled (lighter startup)
;
;  What this does NOT give you (MT5 limitation):
;    - This .ini cannot drag UhvSweepExhaustion onto the chart by itself.
;      MT5's bootloader can attach EAs ONLY via a saved chart profile.
;      Do the one-time setup in mt5/AUTO_ATTACH_SETUP.md and the EA will then
;      auto-attach every time MT5 starts — including from this boot config.
;
;  Notes:
;    - Password is intentionally omitted. MT5's stored credentials are used.
;    - Do NOT add Password=... here — this file is committed to git.
; ============================================================================

[Common]
Login=12640543
Server=BlueberryMarkets-Live02
ProxyEnable=0
CertInstall=0
NewsEnable=0

[Experts]
