;  Hybrid = strict gates ON + tight trail ON.
;
;  HOW TO RUN:
;  1. Open Blueberry Markets MetaTrader 5
;  2. View → Strategy Tester (Ctrl+R)
;  3. Right-click in tester pane → Load INI
;     → C:\Users\zeesh\Documents\GitHub\turtle\mt5\tester_S1Trader_v279hybrid.ini
;  4. Click Start
;  5. When done, right-click Results tab → Save as Report
