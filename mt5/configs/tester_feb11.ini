; ============================================================================
;  tester_feb11.ini — Strategy Tester run for UhvSweepExhaustion on Feb 11
; ============================================================================
;
;  GOAL
;    Quantify how many of Zee's 27 manual setups from 2026.02.11 the EA
;    would catch with current production filters (Magic 88001, Lots 0.10,
;    Tier1 $2, Tier2 $5, HardSL $15, vol>=1.5x, body>=40%, FVG age<=30 M5,
;    sweep>=0.1pt within 8 bars, break within 5 bars, Path B enabled).
;
;  HOW TO RUN (GUI — recommended, won't touch live position)
;    1. Open MT5 → View → Strategy Tester  (or Ctrl+R)
;    2. In the Strategy Tester pane (bottom):
;         Expert:        UhvSweepExhaustion
;         Symbol:        XAUUSD
;         Timeframe:     M1
;         Date range:    2026.02.11 → 2026.02.12  (one full day)
;         Modelling:     Every tick based on real ticks   ← IMPORTANT
;         Forward:       No
;         Optimization:  Disabled (single test, not parameter sweep)
;         Visual mode:   Off (faster) — turn ON if you want chart replay
;         Initial deposit: 2000  Currency: EUR  Leverage: 1:100
;    3. Click "Inputs" tab — defaults are correct (already match production)
;    4. Click Start.
;    5. Wait ~30-90s. Progress bar at the bottom shows download + simulate.
;    6. Once finished:
;         Tester journal:  shows each [SIGNAL] + [ENTRY FILLED] line
;         Results tab:     list of trades with entry/exit/P&L
;         Graph tab:       equity curve
;         Report tab:      summary stats (WR, PF, drawdown)
;    7. Right-click the Results tab → "Save Report" → save as HTML to:
;         C:\Users\zeesh\Documents\GitHub\turtle\monitor\strategy_lab\tester_feb11_report.html
;    8. Then run from terminal:
;         py monitor/strategy_lab/analyze_feb11_tester.py
;       That script reads the HTML report and prints:
;         - EA setups detected vs. Zee's 27 setups
;         - Which of Zee's setups the EA missed (and likely why)
;         - Which EA fires don't correspond to a Zee setup (false positives)
;         - Simulated P&L at 0.10 lots per fire
;
;  WHY REAL TICKS (Model=4) MATTERS
;    The EA's exit logic uses DOM imbalance + tick velocity — both require
;    real microstructure, not synthetic OHLC interpolation. Other modes
;    (Model=0 every-tick from OHLC, Model=1 1min OHLC, Model=2 open prices)
;    will simulate exits incorrectly and give misleading P&L.
;
;  WHAT TO EXPECT
;    The EA fires once per setup (0.10 lots, no scale-in). Even at 100%
;    setup capture rate, position count will be 1/2.56 of Zee's 69 positions.
;    The metric that matters is "27 setups caught: N (X%)".
;
;  FUTURE: AUTOMATED RUN (not recommended right now)
;    The block below is documented for reference; running this .ini via
;    `terminal64.exe /config:tester_feb11.ini` would launch a FRESH MT5
;    instance — which would conflict with the live trading terminal.
;    Only use this for off-hours batch runs after stopping the live EA.
;
;  CONFIG (reference only — don't run while live EA is active)
; ============================================================================

[Tester]
Expert=UhvSweepExhaustion
Symbol=XAUUSD
Period=M1
Login=12640543
Model=4
FromDate=2026.02.11
ToDate=2026.02.12
ForwardMode=0
Deposit=2000
Currency=EUR
ProfitInPips=0
Leverage=1:100
ExecutionMode=0
ShutdownTerminal=0
Visual=0
Replace=0
Optimization=0
OptimizationCriterion=0
Report=monitor\strategy_lab\tester_feb11_report

; TesterInputs left empty — production defaults apply.
; To sweep a single parameter, use:
;   InpUhvVolMultMin=1.5||1.2||0.1||2.0||Y
; (start || min || step || max || optimize_flag)
