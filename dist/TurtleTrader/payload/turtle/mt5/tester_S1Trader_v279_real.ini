; ─────────────────────────────────────────────────────────────────────
;  MT5 Strategy Tester — v2.79 CANDIDATE (RESTORE THE VERIFIED CONFIG)
;
;  Restores the two specific gates that the verify_micro_positive.py script
;  used to prove Zee's "100% UHV breakouts go positive" claim:
;    - InpUhvBodyMin: 0.30 → 0.50   (verification used 0.50)
;    - InpBreakoutVolRatio: 1.00 → 0.75 (verification used 0.75)
;
;  Everything else from v2.78 stays:
;    - HHHL, FVG, H1Bias, UhvNeighborPeak → all OFF (bloom)
;    - Tight trail (TrailLockPts=0.10, TrailRevPts=0.10) — catch the 100% positive
;    - Lots 0.30, harvest $60, daily halt $200, canonical wide SL (no cap)
;
;  This is NOT the strict-gate hybrid (which produced zero trades with latency).
;  This is the minimal correction: only the 2 UHV-quality gates that the verification
;  empirically validated.
;
;  ExecutionMode=1 = random execution delay enabled (realistic latency).
;  Model=0         = every tick from real history (includes historical spread).
;
;  HOW TO RUN:
;  1. Open Blueberry Markets MetaTrader 5
;  2. Ctrl+R → Strategy Tester
;  3. Right-click in tester pane → Load INI
;     → C:\Users\zeesh\Documents\GitHub\turtle\mt5\tester_S1Trader_v279_real.ini
;  4. Click Start. ~5-9 min runtime.
; ─────────────────────────────────────────────────────────────────────

