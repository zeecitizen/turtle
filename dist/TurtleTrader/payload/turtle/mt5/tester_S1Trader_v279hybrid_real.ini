; ─────────────────────────────────────────────────────────────────────
;  MT5 Strategy Tester — v2.79 HYBRID with REAL execution conditions
;
;  Difference from tester_S1Trader_v279hybrid.ini (the idealized one):
;    - ExecutionMode = 50  (50ms order latency — matches real broker round-trip)
;    - Model = 0           (every tick from real history — includes historical spread)
;
;  What MT5 Strategy Tester CANNOT simulate (still optimistic vs live):
;    - Broker rejection (always accepts orders)
;    - Slippage on stop-out fills (assumes exact SL/TP fill)
;    - Spread widening at session boundaries / news events
;    - Commission per trade (Blueberry XAUUSD = ~$0 — already realistic for this broker)
;
;  Estimated realism improvement: ~70-80% of live conditions (vs 50-60% idealized).
;
;  HOW TO RUN:
;  1. Open Blueberry Markets MetaTrader 5
;  2. Ctrl+R → Strategy Tester
;  3. Right-click in tester pane → Load INI
;     → C:\Users\zeesh\Documents\GitHub\turtle\mt5\tester_S1Trader_v279hybrid_real.ini
;  4. Click Start. Will take ~5-8 minutes (latency adds time).
; ─────────────────────────────────────────────────────────────────────

[Tester]
Expert=S1Trader.ex5
Symbol=XAUUSD
Period=M1
Login=
Model=0
ExecutionMode=50
Optimization=0
OptimizationCriterion=6
FromDate=2026.06.10
ToDate=2026.06.16
ForwardMode=0
Deposit=2058
Currency=USD
ProfitInPips=0
Leverage=500
Replace=1
ShutdownTerminal=0
Visual=0
Report=tester_v279hybrid_real_report

[TesterInputs]
; ── Sizing + circuit breakers ──
InpLots=0.30
InpMagicNumber=88005
InpDailyLossHalt=200.0
InpDailyProfitTarget=60.0
InpAutoCloseOnTarget=true
InpDoBuys=true
InpDoSells=true
InpTimeframe=1

; ── STRICT canonical gates (Strategy A — master's 06-05 spec) ──
InpRequireCanonicalOrigin=true
InpRequireH1Fvg=true
InpH1FvgLookback=50
InpRequireHHHL_M5=true
InpHHHL_PivotBars=3
InpHHHL_LookbackM5=24
InpRequireUhvNeighborPeak=true
InpUhvBodyMin=0.30
InpBreakoutVolRatio=0.80
InpBreakoutBodyRatio=0.65
InpMinBreakoutPenetration=0.30

; ── TICK-SPEED catch-the-100% exit (Strategy B — master's 06-09 evolution) ──
InpTrailRevPts=0.10
InpTrailLockPts=0.10
InpTPPoints=1.0
InpDynamicTP=false

; ── SL = canonical wide (no cap) ──
InpSLBufferPts=2.00
InpMaxInitialSLPoints=0.0

; ── Other gates (kept off per bloom + master verbatim) ──
InpRequireSlowTrend=false
InpRequireBigSpreadClimax=false
InpRequireBreakoutMomentum=false
InpRequireBreakoutLowVol=false
InpRequireH1Bias=false
InpMaxOneSameDir=false
InpSkipOvernight=false

; ── Misc ──
InpTrendLookback=24
InpTrendThreshold=7.0
InpERMin=0.0
InpRetraceLookback=15
InpBigSpreadMult=1.3
InpSpreadAvgBars=10
InpHHHL_LookbackH1=24
InpRequireHHHL_H1=false
InpH1BiasBars=6
InpMomentumOverrideEnabled=true
InpMomentumOverridePts=5.0
InpBreakoutMinBodyPts=1.5
InpSessionStartHour=0
InpSessionEndHour=0
InpOvernightStart=0
InpOvernightEnd=6
InpVerbose=true
InpLogPrefix=S1
InpStateFile=s1_trader_state_tester_real.json
InpDecisionCsv=s1_decisions_tester_real.csv
InpHeartbeatSec=5
InpEnableGrab=false
InpAvgWinUsd=40.0
InpGrabFile=grab_command.txt
