<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>UhvSweep · Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:       #0a0a0c;
    --bg-card:  #131318;
    --bg-soft:  #1a1a20;
    --text:     #f5f5f7;
    --text-2:   #a1a1a6;
    --text-3:   #6e6e73;
    --green:    #30d158;
    --green-soft: rgba(48,209,88,0.12);
    --red:      #ff453a;
    --red-soft: rgba(255,69,58,0.12);
    --amber:    #ff9f0a;
    --blue:     #0a84ff;
    --hairline: rgba(255,255,255,0.08);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 80px;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum";
  }
  .container { max-width: 720px; margin: 0 auto; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding: 0 4px;
  }
  .title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .title .ea-name { color: var(--text-2); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 100px;
    font-size: 13px; font-weight: 500;
    background: var(--green-soft); color: var(--green);
  }
  .status-pill.dead { background: var(--red-soft); color: var(--red); }
  .status-pill.warn { background: rgba(255,159,10,0.12); color: var(--amber); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .dot.live { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .hero {
    background: var(--bg-card);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--hairline);
  }
  .hero-label { font-size: 13px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .hero-value { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .hero-value.green { color: var(--green); }
  .hero-value.red   { color: var(--red); }
  .hero-sub { margin-top: 12px; font-size: 14px; color: var(--text-2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--bg-card);
    border-radius: 14px;
    padding: 16px 18px;
    border: 1px solid var(--hairline);
  }
  .card-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .card-value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .card-value.small { font-size: 16px; }
  .card-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

  .section { margin-top: 24px; margin-bottom: 12px; }
  .section-title { font-size: 13px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; padding: 0 4px; }

  .position-card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 20px;
  }
  .position-card.empty { opacity: 0.5; }
  .pos-row { display: flex; justify-content: space-between; padding: 6px 0; }
  .pos-row .l { color: var(--text-3); font-size: 13px; }
  .pos-row .v { font-weight: 500; }
  .tier-badge {
    display: inline-flex; padding: 3px 10px; border-radius: 100px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  }
  .tier-0 { background: var(--bg-soft); color: var(--text-2); }
  .tier-1 { background: rgba(10,132,255,0.15); color: var(--blue); }
  .tier-2 { background: var(--green-soft); color: var(--green); }

  .params {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    font-size: 12px; color: var(--text-2);
  }
  .params .k { color: var(--text-3); }
  .params .v { color: var(--text); font-weight: 500; }

  .footer { text-align: center; color: var(--text-3); font-size: 11px; margin-top: 32px; }
  .footer a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">UhvSweep <span class="ea-name">v1.00</span></div>
    <div id="statusPill" class="status-pill"><span class="dot live"></span><span id="statusText">checking</span></div>
  </div>

  <div class="hero">
    <div class="hero-label">Today's realized</div>
    <div id="realizedToday" class="hero-value">—</div>
    <div id="realizedSub" class="hero-sub">0 signals · 0 entries · 0 exits</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">XAUUSD bid</div>
      <div id="bid" class="card-value">—</div>
      <div id="spread" class="card-sub">—</div>
    </div>
    <div class="card">
      <div class="card-label">Heartbeat</div>
      <div id="hbAge" class="card-value">—</div>
      <div id="contractInfo" class="card-sub">—</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Open position</div>
  </div>
  <div id="positionCard" class="position-card empty">
    <div class="pos-row"><span class="l">Status</span><span class="v">No open position</span></div>
  </div>

  <div class="section">
    <div class="section-title">Strategy parameters</div>
  </div>
  <div class="card">
    <div id="params" class="params"><span class="k">loading…</span><span class="v"></span></div>
  </div>

  <div class="footer">
    UhvSweepExhaustion EA — institutional order flow exit engine ·
    <a href="/">hub</a> · <a href="/shano">legacy shano</a>
  </div>
</div>

<script>
function fmt$(v) {
  if (v == null) return '—';
  const sgn = v >= 0 ? '+' : '−';
  return sgn + '$' + Math.abs(v).toFixed(2);
}

async function refresh() {
  let d;
  try {
    const r = await fetch('/api/uhv-sweep', { cache: 'no-store' });
    d = await r.json();
  } catch (e) { return; }

  // Status pill
  const pill = document.getElementById('statusPill');
  const pillText = document.getElementById('statusText');
  if (d.alive) {
    pill.className = 'status-pill';
    pillText.textContent = 'live';
  } else {
    pill.className = 'status-pill dead';
    pillText.textContent = 'no heartbeat';
  }

  // Hero realized today
  const real = d.realized_today_usd;
  const realEl = document.getElementById('realizedToday');
  const realSub = document.getElementById('realizedSub');
  if (real != null) {
    realEl.textContent = fmt$(real);
    realEl.className = 'hero-value ' + (real >= 0 ? 'green' : (real < 0 ? 'red' : ''));
  } else {
    realEl.textContent = '—';
  }
  realSub.textContent =
    `${d.signals_today || 0} signals · ${d.entries_today || 0} entries · ${d.exits_today || 0} exits`;

  // Bid + spread
  document.getElementById('bid').textContent = d.bid != null ? d.bid.toFixed(2) : '—';
  if (d.bid != null && d.ask != null) {
    document.getElementById('spread').textContent = 'spread ' + ((d.ask - d.bid)).toFixed(3) + ' pts';
  }

  // Heartbeat age
  const age = d.heartbeat_age_sec != null ? d.heartbeat_age_sec : null;
  const hbEl = document.getElementById('hbAge');
  if (age == null) {
    hbEl.textContent = '—';
  } else {
    hbEl.textContent = age + 's';
    hbEl.style.color = age < 10 ? 'var(--green)' : (age < 30 ? 'var(--amber)' : 'var(--red)');
  }
  if (d.contract_size != null) {
    document.getElementById('contractInfo').textContent =
      'contract ' + d.contract_size + ' · symbol ' + (d.symbol || '?');
  }

  // Position card
  const posCard = document.getElementById('positionCard');
  if (d.position_open) {
    const pnl = d.cur_pnl_usd;
    const peak = d.peak_pnl_usd;
    const tier = d.tier || 0;
    const pnlColor = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    posCard.className = 'position-card';
    posCard.innerHTML = `
      <div class="pos-row"><span class="l">Ticket</span><span class="v">${d.ticket}</span></div>
      <div class="pos-row"><span class="l">Entry price</span><span class="v">${d.entry_price.toFixed(2)}</span></div>
      <div class="pos-row"><span class="l">Current P&amp;L</span><span class="v" style="color:${pnlColor};">${fmt$(pnl)}</span></div>
      <div class="pos-row"><span class="l">Peak P&amp;L</span><span class="v" style="color:var(--green);">${fmt$(peak)}</span></div>
      <div class="pos-row"><span class="l">Tier</span><span class="v"><span class="tier-badge tier-${tier}">${tier === 0 ? 'initial' : tier === 1 ? 'tier 1 · break-even' : 'tier 2 · ATR trail'}</span></span></div>
    `;
  } else {
    posCard.className = 'position-card empty';
    posCard.innerHTML = '<div class="pos-row"><span class="l">Status</span><span class="v">No open position</span></div>';
  }

  // Params
  if (d.params) {
    const p = d.params;
    const html = `
      <span class="k">lots</span><span class="v">${p.lots}</span>
      <span class="k">tier 1 trigger</span><span class="v">+$${p.tier1_usd}</span>
      <span class="k">tier 2 trigger</span><span class="v">+$${p.tier2_usd}</span>
      <span class="k">hard SL</span><span class="v">−$${p.hard_sl_usd}</span>
      <span class="k">DOM ratio</span><span class="v">${p.dom_ratio}:1</span>
    `;
    document.getElementById('params').innerHTML = html;
  }
}

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
