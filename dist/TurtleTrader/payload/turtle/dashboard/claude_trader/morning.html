<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overnight Work</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, #0f0f12 0%, #1a1a20 100%);
    min-height: 100vh;
    color: #e8e8ed;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 80px; }
  .header { text-align: left; margin-bottom: 24px; }
  .back-link { color: #6e6e73; text-decoration: none; font-size: 13px; }
  .back-link:hover { color: #007aff; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.4px; margin: 8px 0 6px; }
  .sub { color: #8e8e93; font-size: 15px; margin: 0 0 18px; }

  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px;
  }
  .card-title { font-size: 12px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 6px; }
  .card-value { font-size: 24px; font-weight: 600; color: #e8e8ed; margin: 0; }
  .card-value.green { color: #30d158; }
  .card-value.red   { color: #ff453a; }
  .card-sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }

  .doc-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #c7c7cc;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .tab.active { background: #007aff; color: #fff; border-color: #007aff; }
  .tab:hover:not(.active) { background: rgba(255,255,255,0.1); }

  .doc-body {
    background: #181820;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 22px 26px;
    font-size: 14.5px;
    line-height: 1.6;
  }
  .doc-body h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
  .doc-body h2 { font-size: 17px; margin: 22px 0 8px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
  .doc-body h3 { font-size: 15px; margin: 16px 0 6px; color: #e8e8ed; }
  .doc-body p { margin: 8px 0; }
  .doc-body code { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 3px; font-size: 13px; }
  .doc-body pre { background: #0f0f12; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; line-height: 1.45; }
  .doc-body pre code { background: transparent; padding: 0; }
  .doc-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  .doc-body th, .doc-body td { border: 1px solid rgba(255,255,255,0.1); padding: 6px 10px; text-align: left; }
  .doc-body th { background: rgba(255,255,255,0.04); }
  .doc-body ul, .doc-body ol { padding-left: 22px; }
  .doc-body blockquote { border-left: 3px solid #007aff; margin: 10px 0; padding-left: 12px; color: #a0a0a8; }
  .doc-body a { color: #007aff; }
  .doc-body strong { color: #fff; }
  .doc-body em { color: #ddd; }

  .footer { text-align: center; color: #6e6e73; font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a href="/" class="back-link">← Back to hub</a>
    <h1>🌅 Overnight Work</h1>
    <p class="sub">Autonomous analysis loop · multi-day EA validation · 2026-05-13</p>
  </div>

  <div class="summary-cards" id="summaryCards">
    <div class="card"><div class="card-title">EA</div><div class="card-value" id="kEa">—</div><div class="card-sub" id="kEaSub"></div></div>
    <div class="card"><div class="card-title">Today realized</div><div class="card-value" id="kReal">—</div><div class="card-sub" id="kRealSub"></div></div>
    <div class="card"><div class="card-title">Position</div><div class="card-value" id="kPos">—</div><div class="card-sub" id="kPosSub"></div></div>
    <div class="card"><div class="card-title">Smart cut counterfactual</div><div class="card-value green" id="kCut">+$40.60</div><div class="card-sub">saved on 2 catastrophic SLs overnight</div></div>
  </div>

  <div class="doc-tabs" id="tabs">
    <button class="tab active" data-doc="ZEE_MORNING">🌅 Morning briefing</button>
    <button class="tab" data-doc="OVERNIGHT_SUMMARY">📋 Full summary</button>
    <button class="tab" data-doc="v3_40_proposed_patch">⚙️ v3.40 patch proposal</button>
  </div>

  <div id="docBody" class="doc-body">Loading…</div>

  <div class="footer">
    Generated by autonomous loop iterations 1–13 · ~22 commits not yet pushed
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
async function loadHeartbeat() {
  try {
    const r = await fetch('/api/uhv-sweep', { cache: 'no-store' });
    const d = await r.json();
    document.getElementById('kEa').textContent = d.ea || '—';
    document.getElementById('kEaSub').textContent = (d.heartbeat_age_sec != null) ? `heartbeat ${d.heartbeat_age_sec}s` : '';
    const real = (d.realized_today_usd != null) ? d.realized_today_usd : 0;
    const realEl = document.getElementById('kReal');
    realEl.textContent = (real >= 0 ? '+' : '') + '$' + real.toFixed(2);
    realEl.className = 'card-value ' + (real > 0 ? 'green' : real < 0 ? 'red' : '');
    document.getElementById('kRealSub').textContent = (d.entries_today || 0) + ' entries / ' + (d.exits_today || 0) + ' exits';
    const posOpen = d.position_open;
    document.getElementById('kPos').textContent = posOpen ? d.open_side : 'flat';
    document.getElementById('kPosSub').textContent = posOpen ? (`${d.open_entry} · P&L ${d.open_pnl >= 0 ? '+' : ''}$${(d.open_pnl ?? 0).toFixed(2)}`) : '';
  } catch (e) {
    document.getElementById('kEa').textContent = '(error)';
  }
}

async function loadDoc(name) {
  document.getElementById('docBody').innerHTML = 'Loading…';
  try {
    const r = await fetch('/api/morning/' + name, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const md = await r.text();
    document.getElementById('docBody').innerHTML = marked.parse(md);
  } catch (e) {
    document.getElementById('docBody').textContent = 'Error loading ' + name + ': ' + e.message;
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    loadDoc(t.dataset.doc);
  });
});

loadHeartbeat();
loadDoc('ZEE_MORNING');
setInterval(loadHeartbeat, 5000);
</script>
</body>
</html>
