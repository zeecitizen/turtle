<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle TV</title>
<style>
  :root {
    --bg: #131722; --panel: #1e222d; --line: #2a2e39; --text: #d1d4dc; --muted: #787b86; --up: #26a69a; --down: #ef5350;
    --win: #00e676; --loss: #ff5252; --accent: #2962ff; --warn: #ffb74d; --tt: #26c6da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 6px 12px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 16px; letter-spacing: .02em; margin-right: 4px; }
  .brand b { color: var(--up); }
  .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
  select, input, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.go { background: #089981; border-color: #089981; color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .grp { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; }
  label.tog { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  label.tog input { margin: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--win); } .dot.bad { background: var(--loss); }
  #status { color: var(--muted); font-size: 12px; }
  #status.busy { color: var(--warn); } #status.err { color: var(--loss); }
  #top { display: flex; height: 64vh; min-height: 360px; border-bottom: 1px solid var(--line); }
  #chartWrap { position: relative; flex: 1; min-width: 0; }
  #chart { position: absolute; inset: 0; }
  #legend { position: absolute; left: 10px; top: 6px; z-index: 5; pointer-events: none; font-size: 12px; max-width: 78%; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); }
  #legend .ev { margin-top: 2px; }
  .k { color: var(--muted); }
  #settings { width: 350px; border-left: 1px solid var(--line); overflow: auto; padding: 0 12px 12px; display: none; }
  body.set-open #settings { display: block; }
  #settings .sh { position: sticky; top: 0; background: var(--bg); padding: 8px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
  .igrp h5 { margin: 14px 0 4px; color: var(--accent); font-size: 13px; }
  .inp { padding: 5px 0 7px; border-bottom: 1px solid rgba(42,46,57,.6); }
  .inp .n { display: block; font-size: 14px; margin-bottom: 3px; }
  .inp .n small { font-size: 11px; }
  .inp.chg .n { color: var(--warn); }
  .inp.chg .n::after { content: " •"; }
  .inp.mt5 .n { color: var(--muted); font-style: italic; }
  .inp select, .inp > input { width: 100%; padding: 3px 6px; }
  .inp .sl { display: flex; gap: 8px; align-items: center; }
  .inp .sl input[type=range] { flex: 1; accent-color: #2962ff; min-width: 0; }
  .inp .sl input.num { width: 76px; padding: 2px 6px; }
  #askPanel { width: 400px; border-left: 1px solid var(--line); display: none; flex-direction: column; padding: 0 12px 10px; }
  body.ask-open #askPanel { display: flex; }
  body.ask-open #settings { display: none; }
  #askPanel .sh { padding: 8px 0; border-bottom: 1px solid var(--line); }
  #askLog { flex: 1; overflow: auto; padding: 6px 0; font-size: 13px; }
  #askLog .msg { margin: 8px 0; }
  #askLog .msg.user { color: var(--muted); }
  #askLog .msg.assistant { background: var(--panel); border-radius: 6px; padding: 6px 10px; }
  #askLog ul { padding-left: 18px; margin: 4px 0; }
  #askLog p { margin: 4px 0; }
  .askBox { display: flex; gap: 6px; }
  .askBox textarea { flex: 1; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px; resize: vertical; }
  section.res { border-bottom: 1px solid var(--line); }
  .rh { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; padding-right: 10px; }
  .rh .title { font-weight: 700; padding: 0 12px; }
  .rh .title.tt { color: var(--tt); }
  .rh .info { color: var(--muted); font-size: 12px; margin-left: auto; }
  nav button { background: none; border: 0; border-radius: 0; padding: 9px 10px; color: var(--muted); }
  nav button.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
  .panel { padding: 10px 14px 18px; overflow-x: auto; }
  table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 9px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; background: var(--bg); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--panel); }
  tr.dim td { color: var(--muted); }
  tr.sel td { background: #2a2e39; }
  tr.tot td { font-weight: 700; }
  .scroll { max-height: 420px; overflow: auto; }
  .pos { color: var(--win); } .neg { color: var(--loss); }
  .row { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(118px, 1fr)); gap: 8px; }
  .card { background: var(--panel); border-radius: 6px; padding: 8px 10px; }
  .card .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .l { color: var(--muted); font-size: 11px; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0; max-width: 980px; }
  .warn { color: var(--warn); font-size: 12px; margin: 3px 0; }
  .bad { color: var(--loss); }
  h4 { margin: 4px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .eq { width: 520px; max-width: 100%; height: 170px; }
  .chips span { display: inline-block; background: var(--panel); border-radius: 10px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 11px; }
  #toast { position: fixed; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; max-width: 560px; display: none; z-index: 60; }
  @media (max-width: 900px) { #top { flex-direction: column; height: auto; } #chartWrap { height: 60vh; } #settings, #askPanel { width: 100%; } .cards { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body class="set-open">
<header>
  <div class="brand">Turtle <b>TV</b><small>XAUUSD · Blueberry real ticks · 15 min</small></div>
  <button id="btnSet" title="Show / hide the settings">⚙ Settings</button>
  <button id="btnAsk" title="Send the chart picture and the data behind it to Claude">✦ Ask Claude</button>
  <span class="grp" title="TradingView (the Saad indicator on your open chart)">
    <span class="dot" id="tvDot"></span>
    <button id="btnTake" title="Read the indicator's settings now">take TradingView settings</button>
    <label class="tog"><input type="checkbox" id="tFollow"> follow</label>
  </span>
  <button id="btnCheck" class="primary" title="Run these settings in the MT5 Strategy Tester (real ticks, about a minute)">Check in MT5</button>
  <button id="btnExport" class="go" title="These settings as a preset + JSON for the EA (needs an MT5 result for them)">Export to MT5</button>
  <label class="tog"><input type="checkbox" id="tTrades" checked> trades</label>
  <label class="tog"><input type="checkbox" id="tGhosts" checked> stand-aside</label>
  <label class="tog"><input type="checkbox" id="tSetups"> setups</label>
  <label class="tog"><input type="checkbox" id="tSkips"> skips</label>
  <label class="tog" title="MT5's trades as small triangles over the chart"><input type="checkbox" id="tMt5"> MT5 trades</label>
  <select id="tz" title="Time zone"><option value="18000">Pakistan time</option><option value="0">UTC</option></select>
  <input id="jump" placeholder="go to 2026-03-31" size="13">
  <span id="status"></span>
</header>
<div id="top">
  <section id="chartWrap"><div id="legend"></div><div id="chart"></div></section>
  <aside id="settings">
    <div class="sh"><b>EA settings</b> <span class="k" id="simMs"></span><span style="flex:1"></span>
      <button id="btnReset" title="Back to the EA's defaults (v1.27)">v1.27</button>
      <div style="display:flex;flex-direction:column;gap:6px;width:100%">
        <select id="srcDs" title="The candles the Turtle TV Tester runs on"><option value="year">Blueberry MT5 candles · whole year</option><option value="tv">TradingView's candles · Aug 3 →</option><option value="m15">Blueberry 2023 → now · with 1-min candles</option></select>
        <select id="srcMode" title="Whose rules"><option value="ea">v1.27 EA rules</option><option value="chart">the chart's rules</option><option value="chart_blind">TradingView's way (= its panel)</option></select>
      </div></div>
    <div id="form"></div>
  </aside>
  <aside id="askPanel">
    <div class="sh"><b>Ask Claude</b> <span class="k">sees the chart as it is on screen + the data behind it</span></div>
    <div id="askLog"><p class="k">Ask anything about the chart, a trade, a month, or how to improve the settings. Empty = "what do you see and what should I test next?"</p></div>
    <div class="askBox"><textarea id="askQ" rows="3" placeholder="e.g. why did June lose? what would you change?"></textarea><button id="btnAskGo" class="primary">Ask</button></div>
  </aside>
</div>
<section class="res" id="secTT">
  <div class="rh"><span class="title tt">Turtle TV Tester</span>
    <nav data-sec="tt"><button data-t="overview" class="on">Overview</button><button data-t="months">Months</button><button data-t="weekdays">Weekdays</button>
      <button data-t="range">Range boxes</button><button data-t="trades">List of trades</button><button data-t="skips">Why no trade</button><button data-t="opt">Optimizer</button></nav>
    <span class="info" id="infoTT"></span></div>
  <div class="panel" id="panelTT"></div>
</section>
<section class="res" id="secMT">
  <div class="rh"><span class="title">MT5 Strategy Tester</span>
    <nav data-sec="mt"><button data-t="overview" class="on">Overview</button><button data-t="months">Months</button><button data-t="weekdays">Weekdays</button>
      <button data-t="range">Range boxes</button><button data-t="trades">List of trades</button><button data-t="skips">Why no trade</button></nav>
    <select id="runSel" title="MT5 runs - newest first" style="margin-left:8px;max-width:420px"></select>
    <button id="btnDel" title="Delete this MT5 run">✕</button>
    <span class="info" id="infoMT"></span></div>
  <div class="panel" id="panelMT"></div>
</section>
<div id="toast"></div>
<script src="/static/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
