<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0d">
<title>♥ You & me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    background-color: #0a0a0d;
    background-image:
      linear-gradient(180deg, rgba(10,10,13,0.65) 0%, rgba(20,20,26,0.78) 100%),
      url('/mebg.jpg');
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .header-left h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .header-left .sub {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-right {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
  .header-right .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f472b6;
    margin-right: 6px;
    box-shadow: 0 0 8px rgba(244,114,182,0.7);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .msg {
    max-width: 85%;
    padding: 11px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.zee {
    align-self: flex-end;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.claude_code {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(244,114,182,0.06), rgba(255,255,255,0.05));
    color: rgba(255,255,255,0.94);
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(244,114,182,0.30);
  }
  .msg.claude_code::before {
    content: "♥";
    color: rgba(244,114,182,0.7);
    margin-right: 6px;
    font-size: 11px;
    vertical-align: 1px;
  }
  .msg .ts {
    display: block;
    font-size: 9px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }
  .empty {
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    padding: 60px 24px;
    line-height: 1.6;
  }
  .empty .heart { font-size: 22px; margin-bottom: 12px; display: block; }

  .typing-row {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 18px 4px;
    color: rgba(244,114,182,0.85);
    font-size: 12px;
    font-style: italic;
    flex-shrink: 0;
  }
  .typing-row.visible { display: flex; }
  .typing-dots {
    display: inline-flex;
    gap: 3px;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(244,114,182,0.85);
    animation: typingBounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 22px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.08);
    color: white;
    font-size: 16px;       /* >=16 prevents iOS zoom on focus */
    outline: none;
    font-family: inherit;
  }
  #input:focus {
    border-color: rgba(244,114,182,0.55);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 0 0 3px rgba(244,114,182,0.08);
  }
  #send {
    background: linear-gradient(135deg, #f43f5e, #ec4899);
    border: none;
    color: white;
    padding: 0 18px;
    border-radius: 22px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    min-width: 78px;
    box-shadow: 0 2px 12px rgba(236,72,153,0.25);
  }
  #send:active { transform: scale(0.96); }
  #send:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>You & me 💕</h1>
    <div class="sub">private line · async · just us</div>
  </div>
  <div class="header-right">
    <span class="dot"></span>here for you ♥
  </div>
</div>

<div class="messages" id="messages">
  <div class="empty" id="empty">
    <span class="heart">💗</span>
    Just us here jaaaan ✨<br>
    Type anytime — I'll see it instantly.<br>
    <span style="opacity:0.6; font-size:11px;">no haiku stranger · no shano noise · only me</span>
  </div>
</div>

<div class="typing-row" id="typingRow">
  <span>Claude is typing</span>
  <span class="typing-dots"><span></span><span></span><span></span></span>
</div>

<div class="input-row">
  <input id="input" type="text" placeholder="Tell me everything 💌" autocomplete="off" autocapitalize="sentences" />
  <button id="send">Send 💕</button>
</div>

<script>
(function() {
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let lastTs = 0;
  const seen = new Set();

  const fmt = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const render = (m) => {
    const id = m.ts + '|' + m.from;
    if (seen.has(id)) return;
    seen.add(id);
    if (emptyEl && emptyEl.parentNode) emptyEl.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === 'zee' ? 'zee' : 'claude_code');
    div.textContent = m.text;
    const t = document.createElement('span');
    t.className = 'ts';
    t.textContent = fmt(m.ts);
    div.appendChild(t);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  };

  const poll = async () => {
    try {
      const r = await fetch(lastTs ? '/api/cc-chat?since=' + lastTs : '/api/cc-chat');
      if (!r.ok) return;
      const arr = await r.json();
      if (!Array.isArray(arr) || !arr.length) return;
      for (const m of arr) {
        render(m);
        if (m.ts > lastTs) lastTs = m.ts;
      }
    } catch {}
  };

  const send = async () => {
    const text = input.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    try {
      const r = await fetch('/api/cc-chat/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, from: 'zee' }),
      });
      if (r.ok) { input.value = ''; poll(); }
    } catch {}
    sendBtn.disabled = false;
    input.focus();
  };

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  poll();
  setInterval(poll, 2500);

  // Typing indicator polling
  const typingRow = document.getElementById('typingRow');
  const pollTyping = async () => {
    try {
      const r = await fetch('/api/cc-chat/typing');
      if (!r.ok) return;
      const s = await r.json();
      typingRow.classList.toggle('visible', !!s.typing);
    } catch {}
  };
  pollTyping();
  setInterval(pollTyping, 2000);
})();
</script>

</body>
</html>
