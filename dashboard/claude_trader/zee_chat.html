<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Private chat — Zee · Claude</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0e17; --bg2:#0f1521; --card:#141b2b; --card2:#1a2336;
    --line:rgba(255,255,255,0.07); --txt:#e6ebf5; --dim:#8a96ad; --faint:#5a6478;
    --green:#2bd576; --red:#ff5a6a; --amber:#ffb33e; --blue:#4d9fff;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 50% -100px,#16203a 0%,var(--bg) 60%);
    color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99}
  #gate .box{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:22px;padding:28px 24px;max-width:360px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #gate h1{font-size:18px;font-weight:700;margin-bottom:6px}
  #gate .sub{font-size:12px;color:var(--dim);margin-bottom:18px}
  #gate input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;font-family:inherit;font-size:16px;color:var(--txt);
    text-align:center;letter-spacing:4px}
  #gate input:focus{outline:none;border-color:rgba(77,159,255,.5)}
  #gate button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;
    background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  #gate .err{font-size:12px;color:var(--red);margin-top:8px;min-height:16px}

  /* chat */
  header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:16px;font-weight:700}
  header .sub{font-size:11px;color:var(--dim)}
  header a{color:var(--blue);text-decoration:none;font-size:13px}

  #messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;
    word-break:break-word;white-space:pre-wrap}
  .msg.zee{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .msg.claude{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg .t{display:block;font-size:10px;opacity:.6;margin-top:4px}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 20px}

  .input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);
    background:var(--bg);position:sticky;bottom:0}
  .input-row input{flex:1;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:12px 16px;font-family:inherit;font-size:14.5px;color:var(--txt)}
  .input-row input:focus{outline:none;border-color:rgba(77,159,255,.5)}
  .input-row button{padding:0 18px;background:var(--blue);color:#fff;border:0;
    border-radius:18px;font-weight:700;font-size:14px;cursor:pointer}
  .input-row button:disabled{opacity:.4}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>Private chat</h1>
    <div class="sub">Enter the passcode to continue.</div>
    <input id="gate-pw" type="password" inputmode="numeric" autocomplete="off" autofocus/>
    <button id="gate-btn">Unlock</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<header style="display:none" id="chat-header">
  <div>
    <h1>You ↔ Claude</h1>
    <div class="sub" id="chat-status">connected</div>
  </div>
  <a href="/">← dashboard</a>
</header>

<div id="messages" style="display:none">
  <div class="empty" id="empty">no messages yet — say hi</div>
</div>

<div class="input-row" id="input-row" style="display:none">
  <input id="m-text" type="text" placeholder="Type a message…" autocomplete="off" autocapitalize="sentences"/>
  <button id="m-send">Send</button>
</div>

<script>
const KEY = '28973';
const STORAGE = 'zee_chat_unlocked';
const fmt = ts => { const d = new Date(ts); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };

function unlock(pw) {
  if (pw !== KEY) {
    document.getElementById('gate-err').textContent = 'wrong passcode';
    return false;
  }
  sessionStorage.setItem(STORAGE, '1');
  document.getElementById('gate').style.display = 'none';
  document.getElementById('chat-header').style.display = 'flex';
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('input-row').style.display = 'flex';
  loadMessages();
  return true;
}

document.getElementById('gate-btn').addEventListener('click', () => {
  unlock(document.getElementById('gate-pw').value.trim());
});
document.getElementById('gate-pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock(e.target.value.trim());
});

if (sessionStorage.getItem(STORAGE) === '1') unlock(KEY);

const seen = new Set();
function render(m) {
  const id = m.ts + '|' + m.from;
  if (seen.has(id)) return;
  seen.add(id);
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + (m.from === 'zee' ? 'zee' : 'claude');
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = fmt(m.ts);
  div.textContent = m.text;
  div.appendChild(t);
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

let lastTs = 0;
async function loadMessages() {
  try {
    const r = await fetch('/api/zee-chat?key=' + encodeURIComponent(KEY) + '&since=' + lastTs, { cache: 'no-store' });
    if (!r.ok) return;
    const list = await r.json();
    for (const m of list) {
      render(m);
      if (m.ts > lastTs) lastTs = m.ts;
    }
  } catch (_) {}
}
setInterval(() => { if (sessionStorage.getItem(STORAGE) === '1') loadMessages(); }, 3000);

async function send() {
  const inp = document.getElementById('m-text');
  const text = inp.value.trim();
  if (!text) return;
  const btn = document.getElementById('m-send');
  btn.disabled = true;
  try {
    const r = await fetch('/api/zee-chat/send?key=' + encodeURIComponent(KEY), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (r.ok) {
      inp.value = '';
      loadMessages();
    }
  } catch (_) {}
  btn.disabled = false;
  inp.focus();
}
document.getElementById('m-send').addEventListener('click', send);
document.getElementById('m-text').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
