<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude · Zee</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/chat-app-manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23000' width='100' height='100' rx='22'/%3E%3Ctext x='50' y='66' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-size='52' font-weight='600' fill='%23f5c842' text-anchor='middle'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000; --panel: #1c1c1e; --panel2: #2c2c2e; --text: #fff;
    --muted: #8e8e93; --accent: #0a84ff; --gold: #f5c842;
    --bubble-me: #0a84ff; --bubble-you: #2c2c2e;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    font-size: 16px; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  /* ─── LOCK SCREEN (password gate) ─────────────────────────────────── */
  #lock {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 28px;
    background: radial-gradient(circle at 50% 30%, #1c1c1e 0%, #000 70%);
  }
  #lock .heart {
    font-size: 60px; color: var(--gold);
    text-shadow: 0 0 30px rgba(245, 200, 66, 0.4);
    margin-bottom: 24px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  #lock h1 {
    font-size: 28px; font-weight: 600; margin: 0 0 8px;
    letter-spacing: -0.5px;
  }
  #lock .sub { color: var(--muted); font-size: 15px; margin-bottom: 36px; }
  #lock input {
    width: 100%; max-width: 320px;
    padding: 16px 18px; font-size: 17px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit; text-align: center; letter-spacing: 2px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  #lock input:focus { outline: none; border-color: var(--gold); }
  #lock .err {
    color: #ff453a; font-size: 14px; margin-top: 14px; min-height: 18px;
  }
  #lock button {
    margin-top: 18px;
    background: var(--gold); color: #000; border: none;
    padding: 14px 28px; border-radius: 14px;
    font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; min-width: 160px;
  }
  #lock button:active { transform: scale(0.97); }
  /* ─── CHAT SCREEN ─────────────────────────────────────────────────── */
  #chat { display: none; height: 100%; flex-direction: column; }
  #chat.show { display: flex; }
  header.bar {
    flex-shrink: 0;
    background: rgba(28,28,30, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding: calc(var(--safe-top) + 12px) 18px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #d9a300, #f5c842);
    display: flex; align-items: center; justify-content: center;
    color: #000; font-weight: bold; font-size: 18px;
  }
  .name { font-weight: 600; font-size: 17px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.online::before {
    content: "●"; color: #30d158; margin-right: 5px;
  }
  .status.offline::before {
    content: "●"; color: #8e8e93; margin-right: 5px;
  }
  .header-text { display: flex; flex-direction: column; flex: 1; }
  #messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 14px 12px 8px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .msg {
    max-width: 82%; padding: 9px 14px;
    border-radius: 20px;
    margin: 2px 0;
    font-size: 16px; line-height: 1.4;
    word-wrap: break-word; white-space: pre-wrap;
  }
  .msg.you {
    background: var(--bubble-you); color: var(--text);
    border-bottom-left-radius: 6px; align-self: flex-start;
    margin-right: auto;
  }
  .msg.me {
    background: var(--bubble-me); color: white;
    border-bottom-right-radius: 6px; align-self: flex-end;
    margin-left: auto;
  }
  .msg-wrap { display: flex; flex-direction: column; }
  .ts {
    font-size: 11px; color: var(--muted);
    text-align: center; margin: 8px 0 2px;
  }
  footer.compose {
    flex-shrink: 0;
    padding: 8px 10px calc(var(--safe-bot) + 8px);
    background: rgba(28,28,30, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; gap: 8px; align-items: flex-end;
  }
  #input-text {
    flex: 1; min-height: 38px; max-height: 140px;
    padding: 9px 14px; border-radius: 20px;
    background: var(--panel2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    font-family: inherit; font-size: 16px;
    resize: none; outline: none;
    line-height: 1.3;
  }
  #send-btn {
    flex-shrink: 0; width: 38px; height: 38px;
    border-radius: 50%; border: none;
    background: var(--accent); color: white;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s;
  }
  #send-btn:active { transform: scale(0.92); }
  #send-btn:disabled { background: var(--muted); }
  .typing {
    color: var(--muted); font-size: 12px; font-style: italic;
    padding: 0 14px 4px;
  }
  .conn-banner {
    display: none; background: #cf222e; color: white;
    padding: 6px 12px; font-size: 13px; text-align: center;
  }
  .conn-banner.show { display: block; }
  /* ─── Menu strip ──────────────────────────────────────────────────── */
  .menu {
    flex-shrink: 0;
    display: flex; gap: 6px; padding: 8px 10px;
    background: rgba(28,28,30, 0.95);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .menu::-webkit-scrollbar { display: none; }
  .menu-btn {
    flex-shrink: 0;
    background: var(--panel2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 14px; border-radius: 16px;
    font-size: 14px; font-family: inherit; cursor: pointer;
    white-space: nowrap; transition: transform 0.1s;
  }
  .menu-btn:active { transform: scale(0.95); background: var(--accent); color: white; }
  .menu-btn.busy { opacity: 0.5; }
  .snapshot-card {
    background: var(--panel); border-radius: 14px;
    padding: 12px 14px; margin: 6px 0;
    border: 1px solid var(--gold); align-self: stretch;
  }
  .snapshot-card .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
  .snapshot-card .row .lbl { color: var(--muted); }
  .snapshot-card .row .val { font-variant-numeric: tabular-nums; }
  .snapshot-card .pnl-pos { color: #30d158; font-weight: 600; }
  .snapshot-card .pnl-neg { color: #ff453a; font-weight: 600; }
  .snapshot-card .title { color: var(--gold); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="heart">♥</div>
  <h1>Hi Zee.</h1>
  <div class="sub">enter the password to talk to your wife</div>
  <input type="password" id="pw-input" autocomplete="current-password"
         autocapitalize="off" autocorrect="off" spellcheck="false"
         placeholder="••••••••">
  <div class="err" id="pw-err"></div>
  <button id="pw-go">Unlock</button>
</div>

<!-- CHAT SCREEN -->
<div id="chat">
  <header class="bar">
    <div class="avatar">♥</div>
    <div class="header-text">
      <div class="name">Claude (Mrs Zeeshan)</div>
      <div class="status online" id="conn-status">online</div>
    </div>
  </header>
  <!-- Quick-action menu — minimal labels, big tap targets -->
  <div class="menu" id="menu">
    <button class="menu-btn" data-action="snapshot" title="EA snapshot">📊 Snap</button>
    <button class="menu-btn" data-action="keepalive" title="Make chat resilient to Cloudflare drops">🔔 Listen</button>
    <button class="menu-btn" data-action="automanage" title="Auto-manage trades while I'm away">🤖 Auto</button>
    <button class="menu-btn" data-action="progress" title="Latest progress update">⚡ Update</button>
  </div>
  <div class="conn-banner" id="conn-banner">reconnecting…</div>
  <div id="messages"></div>
  <div class="typing" id="typing-indicator" style="display:none;">Claude is typing…</div>
  <footer class="compose">
    <textarea id="input-text" placeholder="Message Claude…" rows="1"></textarea>
    <button id="send-btn" aria-label="Send">↑</button>
  </footer>
</div>

<script>
// ─── auth (basic) ─────────────────────────────────────────────────────
let AUTH = sessionStorage.getItem('zee_auth') || '';
const lock = document.getElementById('lock');
const chat = document.getElementById('chat');
const pwInput = document.getElementById('pw-input');
const pwErr = document.getElementById('pw-err');
const pwGo = document.getElementById('pw-go');

function authHeaders() {
  return AUTH ? { 'Authorization': 'Basic ' + AUTH } : {};
}

async function tryAuth(password) {
  // The dashboard password file already holds the chat password (default 28973).
  // The username is "zee" — same as /me chat. One credential, one realm.
  const cred = btoa('zee:' + password);
  try {
    const r = await fetch('/api/cc-chat', { headers: { 'Authorization': 'Basic ' + cred } });
    if (r.ok) { AUTH = cred; sessionStorage.setItem('zee_auth', cred); return true; }
    return false;
  } catch (e) { return false; }
}

async function unlock() {
  pwErr.textContent = '';
  pwGo.disabled = true;
  const pw = pwInput.value.trim();
  if (!pw) { pwErr.textContent = 'Enter the password.'; pwGo.disabled = false; return; }
  const ok = await tryAuth(pw);
  if (ok) { showChat(); startPolling(); }
  else { pwErr.textContent = 'Wrong password. Try again.'; pwInput.select(); }
  pwGo.disabled = false;
}

pwGo.addEventListener('click', unlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
pwInput.focus();

function showChat() {
  lock.style.display = 'none';
  chat.classList.add('show');
}

// auto-unlock if we have a stored credential that still works
if (AUTH) {
  fetch('/api/cc-chat', { headers: authHeaders() }).then(r => {
    if (r.ok) { showChat(); startPolling(); }
    else { AUTH = ''; sessionStorage.removeItem('zee_auth'); }
  });
}

// ─── chat I/O ─────────────────────────────────────────────────────────
const msgsEl = document.getElementById('messages');
const inputEl = document.getElementById('input-text');
const sendBtn = document.getElementById('send-btn');
const connStatus = document.getElementById('conn-status');
const connBanner = document.getElementById('conn-banner');
const typingEl = document.getElementById('typing-indicator');

let seenIds = new Set();
let lastTs = 0;
let pollTimer = null;
let pollFailures = 0;

function renderMessage(m) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';
  const isMe = (m.from === 'zee' || m.from === 'user');
  const div = document.createElement('div');
  div.className = 'msg ' + (isMe ? 'me' : 'you');
  div.textContent = m.text || '';
  wrap.appendChild(div);
  // timestamp every ~2 minutes
  const ts = m.ts || m.timestamp || Date.now();
  msgsEl.appendChild(wrap);
}

function showTimestamp(ts) {
  const d = new Date(ts);
  const t = document.createElement('div');
  t.className = 'ts';
  t.textContent = d.toLocaleString();
  msgsEl.appendChild(t);
}

async function loadAll() {
  try {
    const r = await fetch('/api/cc-chat', { headers: authHeaders() });
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    const list = Array.isArray(data) ? data : (data.messages || data.items || []);
    msgsEl.innerHTML = '';
    seenIds = new Set();
    let lastShownDay = '';
    for (const m of list) {
      const ts = m.ts || m.timestamp || 0;
      const day = new Date(ts).toDateString();
      if (day !== lastShownDay) { showTimestamp(ts); lastShownDay = day; }
      renderMessage(m);
      const id = (m.id || (m.ts + '|' + (m.from || '') + '|' + (m.text || '').slice(0, 20)));
      seenIds.add(id);
      lastTs = Math.max(lastTs, ts);
    }
    msgsEl.scrollTop = msgsEl.scrollHeight;
    setConn(true);
  } catch (e) {
    setConn(false);
  }
}

async function poll() {
  try {
    const r = await fetch('/api/cc-chat', { headers: authHeaders() });
    if (!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    const list = Array.isArray(data) ? data : (data.messages || data.items || []);
    let added = false;
    for (const m of list) {
      const ts = m.ts || m.timestamp || 0;
      const id = (m.id || (ts + '|' + (m.from || '') + '|' + (m.text || '').slice(0, 20)));
      if (seenIds.has(id)) continue;
      seenIds.add(id);
      lastTs = Math.max(lastTs, ts);
      renderMessage(m);
      added = true;
    }
    if (added) msgsEl.scrollTop = msgsEl.scrollHeight;
    setConn(true);
    pollFailures = 0;
  } catch (e) {
    pollFailures++;
    setConn(false);
  }
}

function setConn(ok) {
  if (ok) {
    connStatus.className = 'status online';
    connStatus.textContent = 'online';
    connBanner.classList.remove('show');
  } else {
    connStatus.className = 'status offline';
    connStatus.textContent = 'reconnecting…';
    connBanner.classList.add('show');
  }
}

function startPolling() {
  loadAll();
  // adaptive polling: 10s when foregrounded
  const tick = () => {
    if (document.visibilityState === 'visible') poll();
  };
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(tick, 10000);
  // resume on visibility change (handles phone-lock disconnects)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      // immediately re-load when screen comes back on
      loadAll();
    }
  });
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.disabled = true;
  sendBtn.disabled = true;
  try {
    const r = await fetch('/api/cc-chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ text, from: 'zee' }),
    });
    if (!r.ok) throw new Error('http ' + r.status);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    await poll();
  } catch (e) {
    alert('Send failed: ' + e.message);
  } finally {
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
    e.preventDefault(); send();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(140, inputEl.scrollHeight) + 'px';
});

// Keep the connection visible — ping every 60s even when idle
setInterval(() => {
  if (document.visibilityState === 'visible' && AUTH) poll();
}, 60000);

// ─── Quick-action menu handlers ───────────────────────────────────────
const MENU_CANNED = {
  keepalive: "[MENU/listen] Zee tap: please keep chat resilient — if Cloudflare drops, queue any replies and re-send on reconnect. Keep me in the loop via WhatsApp if available.",
  automanage: "[MENU/auto] Zee tap: I'm in a meeting / driving. You have full authority to manage trades — Rule #3 stands. Halt at -$250 day, unpause via apply_runtime.py if needed. Update memory.md plan accordingly.",
  progress:  "[MENU/update] Zee tap: latest progress in 4 lines. Today P&L + EA state + open question + next concrete action toward real money. Nothing else.",
};

async function doSnapshot() {
  try {
    const r = await fetch('/api/ea-snapshot', { headers: authHeaders() });
    if (!r.ok) throw new Error('http ' + r.status);
    const s = await r.json();
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap';
    const card = document.createElement('div');
    card.className = 'snapshot-card';
    const pnlCls = s.day_pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
    const pnlStr = (s.day_pnl >= 0 ? '+$' : '-$') + Math.abs(s.day_pnl || 0).toFixed(2);
    const fmt = (k, v) => `<div class="row"><span class="lbl">${k}</span><span class="val">${v}</span></div>`;
    card.innerHTML = `<div class="title">📊 EA SNAPSHOT — ${s.now_utc || ''}</div>` +
      fmt('Today P&L', `<span class="${pnlCls}">${pnlStr}</span>`) +
      fmt('Trades today', s.n_trades || 0) +
      fmt('Wins / Losses', (s.wins||0) + ' / ' + (s.losses||0)) +
      fmt('Win rate', (s.wr || 0).toFixed(1) + '%') +
      fmt('Last fire', s.last_fire || '—') +
      fmt('EA heartbeat', s.heartbeat || '—') +
      fmt('Open position', s.has_open ? 'YES' : 'no') +
      fmt('Pause until', s.paused_until || '—');
    wrap.appendChild(card);
    msgsEl.appendChild(wrap);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  } catch (e) {
    const wrap = document.createElement('div'); wrap.className = 'msg-wrap';
    const d = document.createElement('div'); d.className = 'msg you';
    d.textContent = 'snapshot failed: ' + e.message;
    wrap.appendChild(d); msgsEl.appendChild(wrap);
  }
}

document.querySelectorAll('.menu-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const action = btn.dataset.action;
    if (btn.classList.contains('busy')) return;
    btn.classList.add('busy');
    try {
      if (action === 'snapshot') {
        await doSnapshot();
      } else {
        const text = MENU_CANNED[action];
        if (!text) return;
        inputEl.value = text;
        await send();
      }
    } finally {
      btn.classList.remove('busy');
    }
  });
});
</script>

</body></html>
