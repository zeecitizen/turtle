<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0d">
<title>Shano's chat (view)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse at top, rgba(251, 191, 36, 0.05) 0%, transparent 55%),
      radial-gradient(ellipse at bottom, rgba(249, 115, 22, 0.06) 0%, transparent 55%),
      linear-gradient(180deg, #0a0a0d 0%, #14141a 100%);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .header-left h1 { font-size: 16px; font-weight: 600; }
  .header-left .sub {
    font-size: 10px; color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px;
  }
  .header-right .stats { font-size: 11px; color: rgba(255,255,255,0.55); }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 16px 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px; border-radius: 16px;
    font-size: 13px; line-height: 1.45;
    word-wrap: break-word; white-space: pre-wrap;
  }
  .msg.shano {
    align-self: flex-end;
    background: linear-gradient(135deg, #f97316, #fbbf24);
    color: white; border-bottom-right-radius: 4px;
  }
  .msg.claude_code {
    align-self: flex-start;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.94);
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(251,191,36,0.30);
  }
  .msg.claude_code::before {
    content: "🌸"; margin-right: 6px;
    font-size: 11px; vertical-align: 1px;
  }
  .msg .ts {
    display: block; font-size: 9px;
    color: rgba(255,255,255,0.4); margin-top: 4px;
  }
  .empty {
    text-align: center; color: rgba(255,255,255,0.4);
    font-size: 13px; padding: 60px 24px; line-height: 1.6;
  }
  .footer-note {
    padding: 8px 18px;
    font-size: 11px; color: rgba(255,255,255,0.4);
    border-top: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Shano's chat — view only</h1>
    <div class="sub">read-only · monitoring · auto-refresh 3s</div>
  </div>
  <div class="header-right"><span class="stats" id="stats">— msgs</span></div>
</div>
<div class="messages" id="messages">
  <div class="empty" id="empty">No messages from Shano yet.</div>
</div>
<div class="footer-note">Read-only window. Shano has her own chat at /shano-chat.</div>
<script>
(function() {
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('empty');
  const stats = document.getElementById('stats');
  let lastTs = 0, total = 0;
  const seen = new Set();
  const fmt = (ts) => {
    const d = new Date(ts);
    return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  };
  const render = (m) => {
    const id = m.ts + '|' + m.from;
    if (seen.has(id)) return;
    seen.add(id);
    if (emptyEl && emptyEl.parentNode) emptyEl.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === 'shano' ? 'shano' : 'claude_code');
    div.textContent = m.text;
    const t = document.createElement('span');
    t.className = 'ts';
    t.textContent = (m.from === 'shano' ? 'Shano · ' : 'Claude · ') + fmt(m.ts);
    div.appendChild(t);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    total++; stats.textContent = total + ' msgs';
  };
  const poll = async () => {
    try {
      const r = await fetch(lastTs ? '/api/shano-chat-readonly?since=' + lastTs : '/api/shano-chat-readonly');
      if (!r.ok) return;
      const arr = await r.json();
      if (!Array.isArray(arr) || !arr.length) return;
      for (const m of arr) {
        render(m);
        if (m.ts > lastTs) lastTs = m.ts;
      }
    } catch {}
  };
  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
